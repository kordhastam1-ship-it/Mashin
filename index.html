<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>رانندگی سه‌بعدی</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;color:#fff;font-family:Tahoma,Arial,sans-serif}canvas{display:block;touch-action:none}#loading{position:fixed;inset:0;display:grid;place-items:center;background:#101820;z-index:10;text-align:center;padding:24px}#loading .box{max-width:360px}#loading strong{font-size:21px}#loading p{color:#c8d2dc;line-height:1.9}#error{color:#ff8585;white-space:pre-wrap;font-size:13px;direction:ltr;text-align:left}#hud{position:fixed;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;gap:10px} .panel{background:#07111dcc;border:1px solid #ffffff24;border-radius:14px;padding:10px 14px;backdrop-filter:blur(8px);pointer-events:auto}.speed{font-size:26px;font-weight:bold;direction:ltr}.speed small{font-size:11px;color:#b8c8d8;display:block;text-align:center}.buttons{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}button{border:1px solid #ffffff30;background:#162b3d;color:white;border-radius:10px;padding:10px 13px;font-size:13px;cursor:pointer}button:active,.active{background:#087f8c}#controls{position:fixed;bottom:22px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.pad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,52px);gap:6px;pointer-events:auto}.pad button{font-size:22px;padding:0;background:#07111dcc;touch-action:none}.pad .up{grid-column:2}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}.pedals{display:flex;gap:8px;pointer-events:auto}.pedals button{width:68px;height:76px;font-size:14px;background:#075d50dd;touch-action:none}.pedals .brake{background:#803a35dd}#hint{position:fixed;bottom:8px;left:0;right:0;text-align:center;color:#d3dce4;font-size:11px;pointer-events:none;text-shadow:0 1px 3px #000}
@media(max-width:520px){.panel{padding:8px 10px}.speed{font-size:22px}.pad{grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,48px)}.pedals button{width:58px;height:68px}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="loading"><div class="box"><strong>🚘 در حال بارگذاری ماشین...</strong><p id="loadtext">در حال دریافت مدل سه‌بعدی از فایل محلی پروژه</p><div id="error"></div></div></div>
<div id="hud"><div class="panel speed"><span id="speed">0</span><small>KM/H</small></div><div class="panel buttons"><button id="camera">📷 تغییر دوربین</button><button id="reset">↻ شروع مجدد</button></div></div>
<div id="controls"><div class="pad"><button class="up" data-key="forward">▲</button><button class="left" data-key="left">◀</button><button class="down" data-key="back">▼</button><button class="right" data-key="right">▶</button></div><div class="pedals"><button class="brake" data-key="brake">ترمز</button><button data-key="forward">گاز</button></div></div>
<div id="hint">با کلیدهای جهت‌دار یا دکمه‌های صفحه رانندگی کنید</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

const loading=document.getElementById('loading'), loadtext=document.getElementById('loadtext'), errorBox=document.getElementById('error');
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x9fc3d8); scene.fog=new THREE.Fog(0x9fc3d8,55,180);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,500);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1;
document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x53616c,2.1));
const sun=new THREE.DirectionalLight(0xffffff,2.6); sun.position.set(12,22,10); scene.add(sun);
// Ground and a simple road environment
const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),new THREE.MeshStandardMaterial({color:0x526b45,roughness:1})); ground.rotation.x=-Math.PI/2; ground.position.y=-.04; scene.add(ground);
const road=new THREE.Mesh(new THREE.PlaneGeometry(12,400),new THREE.MeshStandardMaterial({color:0x30343a,roughness:1})); road.rotation.x=-Math.PI/2; road.position.y=-.015; scene.add(road);
const marks=new THREE.Group(); const markMat=new THREE.MeshBasicMaterial({color:0xe9e4c9});
for(let z=-190;z<200;z+=12){const m=new THREE.Mesh(new THREE.PlaneGeometry(.16,5),markMat);m.rotation.x=-Math.PI/2;m.position.set(0,.005,z);marks.add(m)}scene.add(marks);
const carRoot=new THREE.Group(); scene.add(carRoot);
let carModel=null, carLength=4, speed=0, heading=0, cameraMode=0;
const keys={forward:false,back:false,left:false,right:false,brake:false};
const loader=new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder);
loadtext.textContent='در حال بازکردن مدل GLB و رمزگشایی Meshopt...';
loader.load('./car.glb',gltf=>{
 carModel=gltf.scene;
 const box=new THREE.Box3().setFromObject(carModel); const size=box.getSize(new THREE.Vector3()); const center=box.getCenter(new THREE.Vector3());
 // Center the model around its own origin and place its wheels on the ground.
 carModel.position.sub(center); carModel.position.y += size.y/2;
 const maxDim=Math.max(size.x,size.y,size.z); if(maxDim>0){const s=4.5/maxDim;carModel.scale.setScalar(s);}
 carRoot.add(carModel);
 const scaled=new THREE.Box3().setFromObject(carModel); const dims=scaled.getSize(new THREE.Vector3()); carLength=Math.max(dims.x,dims.z);
 carRoot.position.set(0,0,0);
 loading.style.display='none';
},undefined,err=>{console.error(err);loadtext.textContent='بارگذاری مدل ناموفق بود.';errorBox.textContent='Could not load ./car.glb\n'+(err?.message||String(err))+'\n\nCheck that index.html and car.glb are in the same folder and open the page through GitHub Pages or a local web server.';});

function setKey(k,v){keys[k]=v}
document.querySelectorAll('[data-key]').forEach(btn=>{
 const k=btn.dataset.key;
 const down=e=>{e.preventDefault();setKey(k,true);btn.classList.add('active')};
 const up=e=>{e.preventDefault();setKey(k,false);btn.classList.remove('active')};
 btn.addEventListener('pointerdown',down);btn.addEventListener('pointerup',up);btn.addEventListener('pointercancel',up);btn.addEventListener('pointerleave',up);
});
addEventListener('keydown',e=>{const map={ArrowUp:'forward',KeyW:'forward',ArrowDown:'back',KeyS:'back',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'brake'};if(map[e.code]){e.preventDefault();setKey(map[e.code],true)}});
addEventListener('keyup',e=>{const map={ArrowUp:'forward',KeyW:'forward',ArrowDown:'back',KeyS:'back',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'brake'};if(map[e.code])setKey(map[e.code],false)});
document.getElementById('camera').onclick=()=>cameraMode=(cameraMode+1)%3;
document.getElementById('reset').onclick=()=>{speed=0;heading=0;carRoot.position.set(0,0,0);carRoot.rotation.y=0};
const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);
 if(carModel){if(keys.forward)speed+=10*dt; if(keys.back)speed-=8*dt; if(keys.brake)speed*=Math.pow(.04,dt); if(!keys.forward&&!keys.back&&!keys.brake)speed*=Math.pow(.42,dt); speed=THREE.MathUtils.clamp(speed,-8,28);
  const steer=(keys.left?1:0)-(keys.right?1:0); if(Math.abs(speed)>.15)heading+=steer*1.45*dt*Math.sign(speed)*(0.35+Math.min(Math.abs(speed)/12,1));
  carRoot.rotation.y=heading; carRoot.position.x+=Math.sin(heading)*speed*dt; carRoot.position.z+=Math.cos(heading)*speed*dt;
  document.getElementById('speed').textContent=Math.round(Math.abs(speed)*3.6);
 }
 let desired;
 if(cameraMode===0) desired=new THREE.Vector3(carRoot.position.x-Math.sin(heading)*9,5.2,carRoot.position.z-Math.cos(heading)*9);
 else if(cameraMode===1) desired=new THREE.Vector3(carRoot.position.x,carRoot.position.y+13,carRoot.position.z-1);
 else desired=new THREE.Vector3(carRoot.position.x+Math.sin(heading)*8,3.5,carRoot.position.z+Math.cos(heading)*8);
 camera.position.lerp(desired,1-Math.pow(.001,dt));
 const target=carRoot.position.clone();target.y+=1.1; if(cameraMode===2)target.z+=Math.cos(heading)*4; camera.lookAt(target);
 renderer.render(scene,camera);
}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
