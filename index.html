
<!DOCTYPE html><html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تست مدل سه بعدی ماشین</title><style>
body {
    margin: 0;
    background: #111827;
    color: white;
    font-family: Tahoma, sans-serif;
    text-align: center;
}
h2 { padding: 15px; }
model-viewer {
    width: 100%;
    height: 75vh;
    background: #202b3c;
}
#status {
    padding: 15px;
    font-size: 14px;
}
</style><script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script></head><body><h2>🚗 آزمایش مدل سه‌بعدی ماشین</h2><model-viewer
id="car"
src="./car.glb"
camera-controls
auto-rotate
shadow-intensity="1"
exposure="1"
environment-image="neutral"
camera-orbit="45deg 75deg 4m"
field-of-view="35deg">
</model-viewer>

<div id="status">در حال بارگذاری مدل...</div><script>
const car = document.getElementById('car');
const status = document.getElementById('status');

car.addEventListener('load', () => {
    status.innerHTML = '✅ مدل با موفقیت بارگذاری شد!';
});

car.addEventListener('error', (event) => {
    status.innerHTML = '❌ خطا در بارگذاری مدل! مسیر یا فایل GLB را بررسی کنید.';
    console.error(event);
});
</script></body>
</html>
